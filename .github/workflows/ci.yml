name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    name: Shell (bash -n + shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n (sintaxe de todos os .sh)
        run: |
          set -e
          for f in opsec.sh config.env modules/*.sh; do
            echo ":: $f"
            bash -n "$f"
          done
      - name: shellcheck (erros bloqueiam; avisos informam)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          # SC1091: não segue 'source' de arquivos externos (config.env etc.)
          # Erros param o CI; warnings são exibidos mas não bloqueiam.
          shellcheck -S error -e SC1091 opsec.sh modules/*.sh
          shellcheck -S warning -e SC1091 opsec.sh modules/*.sh || true

  python:
    name: Python (GUI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Parse / compile (sem dependências externas — só stdlib)
        run: |
          python -m py_compile gui/bbghost_gui.py
          python - <<'PY'
          import ast
          ast.parse(open("gui/bbghost_gui.py").read())
          print("GUI: parse OK")
          PY
      - name: pyflakes (lint leve)
        run: |
          python -m pip install --quiet pyflakes
          python -m pyflakes gui/bbghost_gui.py || true

  powershell:
    name: Windows engine (sintaxe PowerShell)
    runs-on: ubuntu-latest   # pwsh já vem instalado nos runners
    steps:
      - uses: actions/checkout@v4
      - name: Parse win/bbghost.ps1
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "win/bbghost.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Output "PS1: parse OK"

  integrity:
    name: Integridade (sign + verify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gera manifesto e verifica consistência
        run: |
          BBGHOST_HOME="$PWD" bash modules/integrity.sh sign
          BBGHOST_HOME="$PWD" bash modules/integrity.sh verify
